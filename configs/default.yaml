env: sandbox
server_ip: ${SERVER_IP}
team_username: ${TEAM_USERNAME}

kafka:
  port: 9094
  consumers: 1
  topics: [market.ticks, market.news]
  auto_offset_reset: latest
  enable_auto_commit: false

api:
  port: 3002
  timeout_s: 1.5
  rate_per_min: 100

timing:
  news_window_ms: 400
  hard_deadline_ms: 800
  heartbeat_interval_s: 10.0
  stage_poll_preflight_s: 2.5
  stage_poll_simulation_s: 30.0

strategy:
  # P3-18: weights are now ESTIMATED, not hand-picked. `weights_mode:
  # optimized` loads configs/optimized_weights.json at boot — produced by
  # scripts/optimize_weights.py from the trade journals using Spearman-IC
  # estimation + Markowitz-on-IC + Monte Carlo bootstrap shrinkage (see
  # bot/portfolio/weight_optimizer.py). The static `weights` below are the
  # fallback if the JSON is missing.
  weights_mode: optimized
  optimized_weights_path: configs/optimized_weights.json
  # Static fallback (fine-tuned 2026-10-29 from tradebook post-mortem).
  weights: { rank: 0.55, news: 0.20, mom: 0.25 }
  top_k: 8  # 2026-10-30: was 6; small universes under-fill the book at top_k 6
  max_weight_name: 0.20  # was 0.15: capped real utilization ~40% after vol sizing
  rebalance_threshold: 0.05
  # P3-14: raised from 50k -> 75k so we concentrate capital, charge fewer
  # brokerage events per Rs moved, and pay 0.05% per side instead of 0.07%.
  min_trade_notional: 75000
  # P3-19: exits use a lower floor than entries — legacy holdings from
  # previous runs must be sellable whenever the model no longer wants them,
  # even if below the 75K entry floor.
  exit_min_notional: 5000
  max_orders_per_day: 8  # was 4: deployment took multiple sim days; churn now controlled by min_hold_days
  # Higher conviction bar — fewer low-conviction churn trades.
  event_long_threshold: 0.75  # restored: iter-2/3 proved higher bars starve the book
  event_short_threshold: -0.75
  # No static blacklist: the bot must be symbol-agnostic (evaluation uses
  # different symbols). Chronic losers are handled ADAPTIVELY by the
  # ticker_bandit hard-veto below, which learns from realised P&L and
  # self-heals — no symbol names anywhere in config or code.
  exclude_tickers: []
  # P3-15: opt-in RL tuner — UCB1 bandit over weight triples. Disabled by
  # default; enable to let the bot adapt weights online based on realised
  # per-day equity delta. See bot/portfolio/rl_tuner.py for the algo.
  rl_tuner:
    enabled: true  # restored after live A/B: pinning weights performed no better
    update_every_trades: 10
    exploration_c: 1.4
    warmup_trades: 20
    arms:
      - { rank: 0.55, news: 0.20, mom: 0.25 }   # current best (analysis)
      - { rank: 0.65, news: 0.10, mom: 0.25 }   # ranker-heavy
      - { rank: 0.50, news: 0.15, mom: 0.35 }   # momentum-heavy
      - { rank: 0.60, news: 0.10, mom: 0.30 }   # rank+mom, drop news
      - { rank: 0.45, news: 0.30, mom: 0.25 }   # balanced (news back)
  # P3-17: idle-cash deployer — after every reconcile (15s), if utilisation
  # is >5pp below target (e.g. realised profits just landed as cash), place
  # one extra BUY for the highest-conviction ticker sized to the gap. Keeps
  # freed capital compounding instead of sitting idle between day-bundles.
  idle_cash_deploy:
    enabled: true
    # P4-05: tightened 0.05 -> 0.02 so the deployer closes right to the
    # utilisation target instead of stopping 5% short (with risk_off at
    # 0.85, 5% slack meant 80% actual — now 83%+ floor everywhere).
    epsilon: 0.02
  # P3-22: per-ticker RL bandit — every realised SELL/COVER updates an EMA of
  # that ticker's P&L; score multiplier = clamp(1 + strength*z, floor, cap).
  # Chronic losers get penalised toward 0.5 (capital rotates to other names),
  # consistent winners get at most a 1.15x boost (no gambling on streaks).
  ticker_bandit:
    enabled: true
    ema_alpha: 0.35
    strength: 0.5
    floor: 0.5
    cap: 1.15
    min_obs: 2
    # Hard BUY-veto: >=3 (decayed) realised trades with edge z <= -0.55
    # blocks new BUYs for chronic losers. Fully symbol-agnostic: learns
    # from realised P&L at runtime and self-heals via 0.90/quiet-day decay.
    # Tightened 2026-10-30 (5->3): current-session autopsy showed AERX
    # losing -20K/-16K/-14K/-12K on FOUR consecutive entries before the
    # 5-pull veto could arm; 3 pulls stops the bleeding one trade earlier
    # while the raised magnitude guard (8K) keeps it aimed at heavy losers.
    veto_pulls: 3  # decayed count; ~3 recent realised trades
    veto_z: -0.55
    # Magnitude guard: veto also needs avg realised <= -8000/trade, so
    # low-win-rate / big-winner names (the profit engine) are NOT vetoed,
    # and neither are small-stakes scratch losers.
    veto_avg_rupees: 8000
    day_decay: 0.90
  # P3-23: take-profit — DISABLED, superseded by trailing_sl below (the
  # trailing stop books max possible profit: winners run past +10% while
  # the stop ratchets up behind them).
  take_profit_pct: 0.0
  # P3-25: rung-ladder partial take-profit (user spec 2026-10-30):
  #   +8%  -> sell 25% of the position
  #   +14% -> sell 25% of what remains
  #   +25% -> sell 25% of what remains
  #   rest (~42% of the original) rides the native score-decay exit.
  # Tournament: single 25%@8% rung cost only -30K vs holding; each extra
  # rung books more visible profit at the price of some winner-tail.
  partial_take_profit:
    enabled: true
    rungs:
      - { pct: 0.08, frac: 0.25 }
      - { pct: 0.14, frac: 0.25 }
      - { pct: 0.25, frac: 0.25 }
  # P4-01: Short Alpha Engine — SEPARATE bearish pipeline, not a reversal of
  # the long strategy. S_short = wR*(-R) + wN*(-N) + wM*(-M) with its own
  # weights (equal thirds baseline — the long 25.7/33.7/40.6 weights are NOT
  # assumed valid for shorts). Modes:
  #   off         = Configuration A (long-only control)
  #   hedge       = Configuration B (shorts only in risk_off regimes)
  #   independent = Configuration C (full long-short)
  # Enabled ONLY after scripts/short_alpha_analysis.py validates that the
  # negative tail actually predicts negative forward returns net of costs.
  # P4-02: churn brake (2026-10-30 loss autopsy: trades held <=2 sim days
  # LOST -3.0L over 169 trades; >2d holds earned +4.7L). Two parts:
  #  1) re-entry cooldown: after SELLing a name, no re-BUY for 3 sim days
  #     unless its fresh score >= 0.90 (exits are never delayed).
  #  2) deployer regime cap: the idle-cash deployer's util target is capped
  #     by risk.gross_long_target[regime] so it stops fighting the regime
  #     scaler in risk_off (the whipsaw's other half).
  reentry_cooldown_days: 3
  reentry_score_override: 0.90
  deployer_regime_cap: true
  short_engine:
    enabled: true
    mode: independent    # off | hedge | independent
    weights: { rank: 0.333, news: 0.333, mom: 0.334 }
    # trigger: two_axis = at least TWO axes must clear the bar (per-axis
    # normalised by observed range). REQUIRED by tradebook evidence
    # (2026-10-30, 50 realized shorts): bearish-MOMENTUM-only shorts have
    # IC -0.213 vs realized short returns — crashed names BOUNCE (mean
    # reversion). Multi-axis agreement filters those traps. any_axis/blend
    # modes kept for A/B. axis_scales from 1,015 journal observations.
    trigger: two_axis
    axis_scales: { rank: 0.15, news: 0.27, mom: 1.0 }
    entry_threshold: 0.75   # user spec 2026-10-30 (raised from 0.63) — per-axis bearish conviction
    exit_threshold: 0.40    # bearish-score decay -> COVER
    adverse_stop_pct: 0.10  # hard stop: price +10% vs short entry
    max_names: 3
    max_weight_short: 0.10  # per-name short cap (stricter than the 20% long cap)
    # P4-03: short profit rungs — mirror of the long ladder. COVER 25% of the
    # short at each favorable move; rest rides the bearish-decay exit.
    # Fixes measured asymmetry: avg short win +1,656 vs avg loss -3,218.
    profit_rungs:
      - { pct: 0.08, frac: 0.25 }
      - { pct: 0.14, frac: 0.25 }
      - { pct: 0.25, frac: 0.25 }
  # P4-04: giveback guard — armed stop for the ladder REMAINDER. Arms only
  # once the close reaches +arm_pct from entry (rung-1 territory); sells the
  # whole remainder if it round-trips back to stop_pct. First overlay ever to
  # beat recorded exits in the 744-trip tournament (+71.2K, arm 8%/stop -2%,
  # only 10 triggers — inert pre-rung, unlike global trailing stops, which
  # LOSE). Fixes the PLNX 2025-11 case: +9.5% peak -> -7.5% on the 75%
  # remainder after rung 1 had booked 25%.
  giveback_guard:
    enabled: true
    arm_pct: 0.08
    stop_pct: -0.02
  # P3-24: stepped trailing SL — DISABLED 2026-10-30 after the exit-strategy
  # tournament (scripts/tune_exits.py, 744 round trips): EVERY mechanical
  # exit overlay lost money vs the native score-decay exit; stepped was the
  # worst (-4.8L, 217 shake-outs — 2% steps are tighter than these stocks'
  # daily noise). Code kept for easy re-enable with wider steps.
  trailing_sl:
    enabled: false
    initial_pct: 0.10
    breakeven_trigger_pct: 0.03
    lock_start_pct: 0.05
    first_lock_pct: 0.03
    step_pct: 0.02
  # --- Strategy improvements (2026-10-29) — each individually disable-able ---
  # Multi-horizon momentum blend: 5d/10d/20d vol-normalised log-return
  # z-scores replace the single-horizon mom sub-score. Remove the block (or
  # set to null) to disable.
  mom_horizon_weights: { d5: 0.3, d10: 0.4, d20: 0.3 }
  # Minimum holding period: SELL/COVER skipped for lots younger than this
  # many sim days (stop-loss + settlement-guard exits exempt). Scalp churn
  # (<3d holds) lost Rs 13K in the tradebook post-mortem. 0 disables.
  min_hold_days: 0  # OFF: early-era scalps were +13.9K; min_hold destroyed the 2:1 win/loss asymmetry
  # Universe-relative entry timing: BUY allowed only if the ticker is in the
  # day's top-2 ensemble scores AND >= its own 20-sim-day median score
  # (median of available days once >= 3; fewer -> gate no-ops).
  entry_timing:
    # DISABLED 2026-10-30 after live diagnosis: combined with fresh_entry_only
    # it starved 100% of entries on the 10-name universe (persistent top-3
    # membership means nothing ever qualifies as "fresh", and high scorers
    # sat below their own trailing median). 0 order flow observed.
    enabled: false
    top_n: 2
    lookback_days: 20
    min_history: 3
  # News decay: exponential per-ticker sentiment decay, half-life in sim
  # days (effective = max over recent days of score * 0.5**(age/half_life)).
  # 0 disables (raw same-day score).
  news_half_life_days: 2.0
  # Ensemble disagreement gate: veto BUYs where sign(rank) != sign(mom) and
  # both |scores| > threshold; journaled as HOLD w/ signal_disagreement.
  disagreement_gate:
    enabled: true
    threshold: 0.1
  # Mean reversion in risk_off: momentum is anti-predictive in risk-off, so
  # the mom sub-score is replaced by the negative 10d return z-score.
  mean_reversion_in_risk_off: true
  # Fresh entry only: a ticker enters the target book only if it newly
  # entered the top-3 today (wasn't in yesterday's top-3 by score).
  # Existing holdings are unaffected (exits/rebalances proceed normally).
  # DISABLED 2026-10-30: on a small stable universe the top-3 rarely churns,
  # so this vetoed every BUY indefinitely (live diag: fresh_entry_blocked
  # on 100% of candidates, zero orders placed).
  fresh_entry_only: false

risk:
  # Wider ATR stop so we don't get shaken out of mid-band winners on 1-2d dips.
  stop_atr_mult: 3.5  # restored: 2.0 cut winners along with losers in live test
  # Less aggressive de-risking — 0.08 was tripping on noise.
  dd_soft: 0.12
  dd_hard: 0.15
  # P3-14: 5% -> 2% so we keep >80% of equity invested most of the time.
  cash_buffer: 0.02
  max_short_gross: 0.20
  # Per-name short cap — was hardcoded 0.05 in risk.check_short and silently
  # rejected every engine-sized 10% short (RISK_SINGLE_SHORT, 2026-10-30).
  max_short_single: 0.10
  max_name_weight: 0.20  # unified with strategy.max_weight_name (0.15 silently vetoed 20%-target orders)
  max_sector_weight: 0.30
  # P3-14: target cash utilisation (long_mv / equity). When below target,
  # the constructor inflates gross exposure; when above, deflates. Keeps
  # 80-90% of the wallet invested most of the time.
  target_cash_utilization: 0.95  # was 0.85; cash_buffer 0.02 + server clamps still guard margin
  # P3-14: cap a single BUY at this fraction of available cash to avoid
  # INSUFFICIENT_CAPITAL rejections (was 99% of cash on one trade).
  max_cash_per_trade: 0.90
  # P4-05: user mandate 2026-10-30 — keep allocation ABOVE 80% in EVERY
  # regime. risk_off de-risking is now provided by the bandit veto, the
  # churn brake and the exit stack (trend blend + giveback guard) instead
  # of gross exposure cuts (the 0.40 floor was the main reason utilization
  # averaged ~25-60%).
  gross_long_target: { risk_on: 0.95, neutral: 0.90, risk_off: 0.85 }

tax:
  ltcg_wait_days: 30
  harvest_window_days: 10
  min_tax_saving: 70
  brokerage_per_order: 20.0
  dp_charge_per_sell: 15.34
  stcg_rate: 0.15
  ltcg_rate: 0.10
  ltcg_exemption: 100000
  fy_start_month: 4
  fy_start_day: 1
  st_lt_boundary_days: 365

settlement:
  interval_trading_days: 10
  force_close_before_days: 2

signals:
  # M1a — keyword event tagger (docs/05 §3.1)
  event_tagger:
    magnitude_scale: 0.05
  # P2-08 — TF-IDF + KMeans sector clustering
  sector_cluster:
    n_clusters: 6
    min_n_clusters: 2
    max_n_clusters: 10
    random_seed: 42
    max_features: 4000
    ngram_max: 2
    min_df: 2
  # Ensemble weights (sum need not be 1; renormalised over available signals)
  weights: { rank: 0.45, news: 0.35, mom: 0.20 }
  # Volatility-scaled conviction: divide each ticker's final ensemble score
  # by its realized vol before ranking (vol<=0 -> skip scaling).
  vol_scale_scores: true
  # M5 regime detection owns its own RegimeConfig — see bot.models.regime.